<article class="job-card">
  <header class="job-card__header">
    <h3 class="job-card__title">{{ application().title }}</h3>
    <div class="job-card__actions">
      <a class="job-card__icon-button" [routerLink]="['/applications', application().id, 'edit']" aria-label="Edit application">✎</a>
      <button type="button" class="job-card__icon-button job-card__icon-button--danger" aria-label="Delete application" (click)="onDelete()">×</button>
    </div>
  </header>

  <p class="job-card__description">{{ application().description }}</p>

  <footer class="job-card__footer">
    <time class="job-card__date">{{ application().applicationStartDate | date: 'mediumDate' }}</time>
    <select [class]="statusClass()" aria-label="Change status" (change)="onStatusChange($event)">
      @for (status of statuses; track status) {
        <option [value]="status" [selected]="status === application().status">{{ status }}</option>
      }
    </select>
  </footer>
</article>
